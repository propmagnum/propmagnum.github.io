<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<!-- ====== CAMBIAR POR CASA: título y vista previa de WhatsApp ====== -->
<title>Casa en renta · Valles del Molino</title>
<meta property="og:title" content="Casa en renta · Valles del Molino">
<meta property="og:description" content="$28,000 MXN / mes · 234 m² terreno · 280 m² construcción · León, Gto.">
<meta property="og:image" content="https://propmagnum.github.io/valles-del-molino/fotos/01.jpg">
<!-- ================================================================= -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Manrope:wght@400;500;600;700&display=swap">
<style>
/* Layout: pantalla 1 = foto horizontal + precio + 5 datos (cabe en un celular); al deslizar: fotos, ficha técnica, ubicación con lugares cercanos. Diseño claro único, a propósito. */
:root{
  --bg:#F4F5F3;
  --surface:#FFFFFF;
  --ink:#16201C;
  --muted:#5E6762;
  --line:#DCE0DC;
  --accent:#2E5A4E;
  --accent-soft:#E6EEEA;
  --display:"DM Serif Display", Georgia, "Times New Roman", serif;
  --body:"Manrope", "Helvetica Neue", Arial, sans-serif;
  color-scheme: light;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
.wrap{max-width:920px;margin:0 auto;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
img{max-width:100%;display:block}
.label{font-size:.68rem;letter-spacing:.18em;text-transform:uppercase;font-weight:600;color:var(--muted)}

/* ---------- Pantalla 1 ---------- */
.first{display:flex;flex-direction:column;background:var(--surface)}
.hero{position:relative;flex:none;height:clamp(56vw, calc(100svh - 375px), 90vw);max-width:none;background:#cfd6d2;overflow:hidden}
.hero img{position:absolute;inset:0}
.hero img{width:100%;height:100%;object-fit:cover;object-position:50% 62%}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,16,13,.30) 0%,rgba(10,16,13,0) 28%,rgba(10,16,13,0) 50%,rgba(10,16,13,.72) 100%)}
.hero .top{position:absolute;top:12px;left:max(16px, env(safe-area-inset-left, 0px));right:max(16px, env(safe-area-inset-right, 0px));display:flex;justify-content:space-between;align-items:center;z-index:2}
.pill{background:#fff;color:var(--ink);font-size:.62rem;letter-spacing:.18em;font-weight:700;padding:5px 10px;border-radius:2px}
.ref{color:#fff;font-size:.66rem;letter-spacing:.16em;font-weight:500}
.hero .txt{position:absolute;left:max(16px, env(safe-area-inset-left, 0px));right:16px;bottom:12px;z-index:2;color:#fff}
.hero .txt .label{color:#DCE8E3;font-size:.62rem}
.hero h1{font-family:var(--display);font-weight:400;font-size:clamp(1.8rem,7.5vw,3.2rem);line-height:1;margin:.08em 0 0;text-wrap:balance}

.facts{flex:none;display:flex;flex-direction:column;gap:14px;padding:18px max(16px, env(safe-area-inset-right, 0px)) 16px max(16px, env(safe-area-inset-left, 0px))}
.price{font-family:var(--display);font-size:clamp(2.2rem,9.5vw,3.1rem);line-height:1;margin-top:4px;font-variant-numeric:tabular-nums}
.price small{font-family:var(--body);font-size:.78rem;color:var(--muted);margin-left:4px;letter-spacing:.04em}
.chip{display:inline-flex;flex-wrap:wrap;align-items:center;gap:4px 8px;align-self:flex-start;background:var(--accent-soft);color:var(--accent);font-size:.85rem;font-weight:600;padding:7px 12px;border-radius:3px}
.chip b{font-weight:700;font-variant-numeric:tabular-nums}
.chip span{font-weight:500;opacity:.85}
.chip[hidden]{display:none}
.stats{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));border:1px solid var(--line);border-radius:4px;overflow:hidden}
.stat{display:flex;align-items:center;gap:10px;padding:12px 14px;min-width:0;border-top:1px solid var(--line)}
.stat:nth-child(-n+2){grid-column:span 3;border-top:0;justify-content:center}
.stat:nth-child(n+3){grid-column:span 2;flex-direction:column;align-items:center;gap:4px;text-align:center;padding:12px 6px}
.stat:nth-child(2),.stat:nth-child(4),.stat:nth-child(5){border-left:1px solid var(--line)}
.stat svg{width:24px;height:24px;flex:none;stroke:var(--accent);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;display:block}
.stat div{min-width:0}
.stat .n{font-size:1.25rem;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums;white-space:nowrap;letter-spacing:.01em}
.stat .n sup{font-size:.62rem;font-weight:600}
.stat .l{font-size:.78rem;color:var(--muted);line-height:1.2;margin-top:2px}
.more{margin-top:2px;align-self:center;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--muted);font-size:.72rem;letter-spacing:.06em;text-decoration:none;padding-top:6px}
.more svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;animation:bob 1.8s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(3px)}}

/* ---------- Secciones ---------- */
section{margin-top:32px}
.sh{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:12px}
.sh h2{font-family:var(--display);font-weight:400;font-size:1.35rem;margin:0;line-height:1.1;text-wrap:balance}

/* Carrusel */
.carousel{position:relative;background:var(--ink);border-radius:4px;overflow:hidden}
.track{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scroll-behavior:smooth;scrollbar-width:none}
.track::-webkit-scrollbar{display:none}
.slide{flex:0 0 100%;scroll-snap-align:center;aspect-ratio:4/3;max-width:100%}
.slide img{width:100%;height:100%;object-fit:contain;background:var(--ink)}
.nav{position:absolute;top:50%;transform:translateY(-50%);width:38px;height:38px;border-radius:50%;border:0;background:rgba(255,255,255,.92);color:var(--ink);font-size:1.3rem;cursor:pointer;display:grid;place-items:center;box-shadow:0 2px 10px rgba(0,0,0,.2)}
.prev{left:10px}.next{right:10px}
.thumbs{display:flex;gap:6px;overflow-x:auto;padding:8px 0 2px;scrollbar-width:none}
.thumbs::-webkit-scrollbar{display:none}
.thumb{flex:0 0 68px;height:50px;border:2px solid transparent;border-radius:3px;padding:0;overflow:hidden;cursor:pointer;opacity:.55;background:none}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb[aria-current="true"]{border-color:var(--accent);opacity:1}
.nav:focus-visible,.thumb:focus-visible,.mapCard a:focus-visible,summary:focus-visible,.btn:focus-visible,.more:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* Ficha técnica */
details{background:var(--surface);border:1px solid var(--line);border-radius:4px}
summary{list-style:none;cursor:pointer;padding:16px 18px;display:flex;justify-content:space-between;align-items:center;gap:12px}
summary::-webkit-details-marker{display:none}
summary h2{font-family:var(--display);font-weight:400;font-size:1.3rem;margin:0;line-height:1.1}
summary .plus{width:30px;height:30px;flex:none;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;font-size:1.1rem;transition:transform .2s}
details[open] .plus{transform:rotate(45deg)}
.sheet{padding:0 18px 18px;display:grid;gap:16px}
.spec div{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);font-size:.9rem}
.spec div span:first-child{color:var(--muted)}
.spec div span:last-child{font-weight:600;text-align:right}
.sheet h4{margin:0 0 4px;font-size:.68rem;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
.sheet ul{margin:0;padding-left:18px;font-size:.92rem}
.sheet li{margin:3px 0}
.btn{display:inline-flex;align-items:center;gap:8px;background:transparent;color:var(--ink);border:1px solid var(--ink);font-weight:600;font-size:.85rem;padding:10px 16px;border-radius:3px;cursor:pointer;font-family:var(--body)}
.copyRow{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.copyRow small{color:var(--muted)}

/* Ubicación */
.mapCard{background:var(--surface);border:1px solid var(--line);border-radius:4px;overflow:hidden}
.mapCard a{display:block;text-decoration:none;color:var(--ink)}
.mapArt{position:relative;height:150px;overflow:hidden;background:var(--accent-soft)}
.mapArt svg{position:absolute;inset:0;width:100%;height:100%}
.mapBar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px 12px;padding:14px 16px}
.mapBar b{display:block;font-size:.95rem}
.mapBar small{color:var(--muted);font-size:.8rem}
.mapBar .go{font-size:.82rem;font-weight:700;color:var(--accent);white-space:nowrap;text-decoration:underline;text-underline-offset:3px}
.near{padding:14px 16px 16px;border-top:1px solid var(--line)}
.near .label{margin-bottom:10px;display:block}
.nearGrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 16px}
.place{display:flex;gap:10px;align-items:flex-start;min-width:0}
.place svg{width:18px;height:18px;flex:none;margin-top:2px;stroke:var(--accent);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.place div{min-width:0}
.place b{display:block;font-size:.85rem;font-weight:600;line-height:1.3}
.place small{color:var(--muted);font-size:.75rem}
.note{margin:10px 0 0;font-size:.7rem;color:var(--muted)}

.foot{display:flex;flex-wrap:wrap;gap:4px 16px;justify-content:space-between;margin:28px 0 28px;padding-top:14px;border-top:1px solid var(--line);font-size:.66rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}

/* Celular: primera pantalla de borde a borde */
@media (max-width:699px){
  .first{margin-left:calc(-1 * max(16px, env(safe-area-inset-left, 0px)));margin-right:calc(-1 * max(16px, env(safe-area-inset-right, 0px)))}
}
@media (max-width:360px){
  .stat{padding:10px}
  .stat .n{font-size:1.1rem}
  .nearGrid{grid-template-columns:1fr}
}
/* Pantallas grandes */
@media (min-width:700px){
  .wrap{padding-top:16px}
  .first{min-height:0;border:1px solid var(--line);border-radius:4px;overflow:hidden}
  .hero{flex:none;aspect-ratio:16/9;height:auto}
  .hero .top{left:20px;right:20px;top:18px}
  .hero .txt{left:28px;bottom:22px}
  .facts{padding:22px 28px}
  .stat .n{font-size:1.4rem}
  .more{display:none}
  section{margin-top:40px}
  .slide{aspect-ratio:16/10}
  .mapArt{height:190px}
  .nearGrid{grid-template-columns:repeat(3,minmax(0,1fr))}
}
@media (prefers-reduced-motion:reduce){.track{scroll-behavior:auto}*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<script>
/* =====================================================================
   DATOS DE LA PROPIEDAD — es lo ÚNICO que cambia de una casa a otra.
   Fotos: fotos/01.jpg, 02.jpg… (01 = portada) y miniaturas en fotos/t/.
   ===================================================================== */
const DATA = {
  "slug": "valles-del-molino",
  "ref": "VDM-01",
  "tipo": "Casa",
  "operacion": "renta",
  "precio": 28000,
  "avaluo": null,
  "mantenimiento": {
    "tipo": "aparte"
  },
  "fraccionamiento": "Valles del Molino",
  "ciudad": "León, Guanajuato",
  "zona": "",
  "mapa": "https://www.google.com/maps/search/?api=1&query=Valles+del+Molino+Le%C3%B3n+Guanajuato",
  "terreno": 234,
  "construccion": 280,
  "recamaras": {
    "n": "4",
    "l": "Recámaras + 1 en planta baja"
  },
  "banos": {
    "n": "4",
    "l": "Baños + 1 medio"
  },
  "autos": {
    "n": "2",
    "l": "Autos + semitechados"
  },
  "ficha": [
    [
      "Recámaras",
      "4 (1 en planta baja)"
    ],
    [
      "Baños",
      "4 completos y 1 medio"
    ],
    [
      "Estacionamiento",
      "Cochera semitechada para 2 autos"
    ]
  ],
  "plantas": [
    {
      "titulo": "Planta baja",
      "items": [
        "Sala-comedor",
        "Cocina con barra",
        "Recámara con baño completo",
        "Terraza",
        "Cuarto de servicio con baño",
        "Área de lavado y bodega",
        "Cochera para 2 autos"
      ]
    },
    {
      "titulo": "Planta alta",
      "items": [
        "3 recámaras con vestidor y baño completo",
        "Área de TV"
      ]
    },
    {
      "titulo": "Roof-top",
      "items": [
        "Terraza",
        "Medio baño"
      ]
    }
  ],
  "extras": [],
  "cercanos": [],
  "fotos": 20
};
</script>

<div class="wrap">
  <div class="first">
    <header class="hero">
      <img id="heroImg" src="fotos/01.jpg" alt="" fetchpriority="high">
      <div class="top"><span class="pill" id="opTag"></span><span class="ref" id="refTop"></span></div>
      <div class="txt"><div class="label" id="ciudad"></div><h1 id="titulo"></h1></div>
    </header>
    <div class="facts">
      <div><div class="label" id="priceLabel"></div><div class="price" id="price"></div></div>
      <div class="chip" id="chip"></div>
      <div class="stats" id="stats"></div>
      <a class="more" href="#galeria"><span>Ver fotos</span><svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></a>
    </div>
  </div>

  <section aria-labelledby="galeria-t" id="galeria">
    <div class="sh"><h2 id="galeria-t">Conoce tu próximo hogar</h2><span class="label" id="count"></span></div>
    <div class="carousel">
      <div class="track" id="track" tabindex="0" aria-label="Fotos de la propiedad"></div>
      <button class="nav prev" id="prev" aria-label="Foto anterior">&#8249;</button>
      <button class="nav next" id="next" aria-label="Foto siguiente">&#8250;</button>
    </div>
    <div class="thumbs" id="thumbs"></div>
  </section>

  <section>
    <details id="ficha">
      <summary><div><div class="label">¿Quieres saber más?</div><h2>Ficha técnica</h2></div><span class="plus" aria-hidden="true">+</span></summary>
      <div class="sheet">
        <div class="spec" id="spec"></div>
        <div id="plantas" style="display:grid;gap:16px"></div>
        <div id="extrasBox"><h4>Extras</h4><ul id="extras"></ul></div>
        <div class="copyRow">
          <button class="btn" id="copy" type="button">Copiar ficha para WhatsApp</button>
          <small id="copyMsg" aria-live="polite"></small>
        </div>
        <textarea id="waText" hidden readonly></textarea>
      </div>
    </details>
  </section>

  <section aria-labelledby="ubic">
    <div class="sh"><h2 id="ubic">Conoce la ubicación</h2></div>
    <div class="mapCard">
      <a id="mapa" target="_blank" rel="noopener">
        <div class="mapBar">
          <div><b id="mapNombre"></b><small id="mapZona"></small></div>
          <span class="go">Ver en Google Maps</span>
        </div>
      </a>
      <div class="near" id="nearBox">
        <span class="label">Cerca de la propiedad</span>
        <div class="nearGrid" id="near"></div>
        <p class="note">Tiempos aproximados en auto.</p>
      </div>
    </div>
  </section>

  <footer class="foot"><span id="refFoot"></span><span>Precio y disponibilidad sujetos a cambio sin previo aviso</span></footer>
</div>

<script>
const $ = id => document.getElementById(id);
const mxn = n => "$" + Number(n).toLocaleString("en-US");
const esc = t => String(t).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const renta = DATA.operacion === "renta";
const pad = i => String(i).padStart(2, "0");

/* Portada */
$("opTag").textContent = renta ? "EN RENTA" : "EN VENTA";
$("refTop").textContent = "REF. " + DATA.ref;
$("refFoot").textContent = "Ref. " + DATA.ref;
$("ciudad").textContent = DATA.ciudad;
$("titulo").textContent = DATA.fraccionamiento;
$("heroImg").alt = DATA.tipo + " en " + DATA.fraccionamiento;
$("priceLabel").textContent = renta ? "Renta mensual" : "Precio de venta";
$("price").innerHTML = mxn(DATA.precio) + `<small>${renta ? "MXN / mes" : "MXN"}</small>`;

let chip = "";
if (!renta && DATA.avaluo) {
  const pct = Math.round((1 - DATA.precio / DATA.avaluo) * 100);
  chip = `<span>Avalúo</span><b>${mxn(DATA.avaluo)} MXN</b>` + (pct > 0 ? `<span>· ${pct}% abajo</span>` : "");
} else if (renta && DATA.mantenimiento) {
  const m = DATA.mantenimiento;
  if (m.tipo === "aprox") chip = `<span>Mantenimiento</span><b>${mxn(m.monto)} MXN</b><span>aprox.</span>`;
  if (m.tipo === "aparte") chip = `<span>Renta</span><b>${mxn(DATA.precio)}</b><span>+ mantenimiento</span>`;
  if (m.tipo === "incluido") chip = `<b>Mantenimiento incluido</b>`;
}
if (chip) $("chip").innerHTML = chip; else $("chip").hidden = true;

const ic = {
  terreno: '<rect x="3" y="3" width="18" height="18"/><path d="M3 9h3M18 15h3M9 3v3M15 18v3"/>',
  constr: '<path d="M3 21V9l9-6 9 6v12"/><path d="M9 21v-6h6v6"/>',
  rec: '<path d="M3 18V8M21 18v-5a3 3 0 0 0-3-3H8v8"/><path d="M3 15h18"/><circle cx="6" cy="11.5" r="1.5"/>',
  bano: '<path d="M4 12h16v3a5 5 0 0 1-5 5H9a5 5 0 0 1-5-5z"/><path d="M6 12V5a2 2 0 0 1 4 0"/>',
  auto: '<path d="M5 13l1.6-4.3A2 2 0 0 1 8.5 7.4h7a2 2 0 0 1 1.9 1.3L19 13"/><path d="M3.5 13h17v4.5h-17z"/><path d="M5.5 17.5V19M18.5 17.5V19"/><circle cx="7.5" cy="15.2" r=".6"/><circle cx="16.5" cy="15.2" r=".6"/>'
};
const m2 = (v, s) => typeof v === "number" ? v + s : esc(v);
const lbl = t => esc(t).replace(" + ", "<br>+ ");
const stat = (i, n, l) => `<div class="stat"><svg viewBox="0 0 24 24">${i}</svg><div><div class="n">${n}</div><div class="l">${l}</div></div></div>`;
$("stats").innerHTML =
  stat(ic.terreno, m2(DATA.terreno, "<sup> m²</sup>"), "Terreno") +
  stat(ic.constr, m2(DATA.construccion, "<sup> m²</sup>"), "Construcción") +
  stat(ic.rec, esc(DATA.recamaras.n), lbl(DATA.recamaras.l)) +
  stat(ic.bano, esc(DATA.banos.n), lbl(DATA.banos.l)) +
  stat(ic.auto, esc(DATA.autos.n), lbl(DATA.autos.l));

/* Ficha técnica */
const rows = [["Operación", renta ? "Renta" : "Venta"], ["Precio", mxn(DATA.precio) + (renta ? " MXN / mes" : " MXN")]];
if (!renta && DATA.avaluo) rows.push(["Avalúo", mxn(DATA.avaluo) + " MXN"]);
if (renta && DATA.mantenimiento) {
  const m = DATA.mantenimiento;
  rows.push(["Mantenimiento", m.tipo === "aprox" ? mxn(m.monto) + " MXN aprox." : m.tipo === "incluido" ? "Incluido" : "Se paga aparte"]);
}
rows.push(["Terreno", m2(DATA.terreno, " m²")], ["Construcción", m2(DATA.construccion, " m²")], ...DATA.ficha);
$("spec").innerHTML = rows.map(([a, b]) => `<div><span>${esc(a)}</span><span>${esc(b)}</span></div>`).join("");
$("plantas").innerHTML = DATA.plantas.map(p => `<div><h4>${esc(p.titulo)}</h4><ul>${p.items.map(i => `<li>${esc(i)}</li>`).join("")}</ul></div>`).join("");
if (DATA.extras.length) $("extras").innerHTML = DATA.extras.map(i => `<li>${esc(i)}</li>`).join(""); else $("extrasBox").hidden = true;

/* Ubicación */
$("mapa").href = DATA.mapa;
$("mapNombre").textContent = DATA.fraccionamiento;
$("mapZona").textContent = [DATA.zona, DATA.ciudad].filter(Boolean).join(" · ");
const pi = {
  escuela: '<path d="M3 9l9-5 9 5-9 5z"/><path d="M7 11v5c3 2 7 2 10 0v-5"/>',
  hospital: '<rect x="4" y="4" width="16" height="16" rx="2"/><path d="M12 8v8M8 12h8"/>',
  super: '<path d="M3 4h2l2.5 11h11L21 7H6"/><circle cx="9" cy="19" r="1.3"/><circle cx="17" cy="19" r="1.3"/>',
  plaza: '<path d="M5 8h14l-1 12H6z"/><path d="M9 8a3 3 0 0 1 6 0"/>',
  parque: '<path d="M12 21v-6"/><path d="M12 15c-4 0-6-3-6-6a6 6 0 0 1 12 0c0 3-2 6-6 6z"/>',
  avenida: '<path d="M8 3L5 21M16 3l3 18M12 5v2M12 11v2M12 17v2"/>'
};
if (DATA.cercanos.length) {
  $("near").innerHTML = DATA.cercanos.map(c => `<div class="place"><svg viewBox="0 0 24 24">${pi[c.tipo] || pi.avenida}</svg><div><b>${esc(c.nombre)}</b><small>${esc(c.tiempo)}</small></div></div>`).join("");
} else $("nearBox").hidden = true;

/* Carrusel */
const track = $("track"), thumbs = $("thumbs"), N = DATA.fotos;
for (let i = 1; i <= N; i++) {
  const s = document.createElement("div"); s.className = "slide";
  s.innerHTML = `<img src="fotos/${pad(i)}.jpg" alt="Foto ${i} de la propiedad" loading="lazy">`;
  track.appendChild(s);
  const t = document.createElement("button"); t.className = "thumb"; t.type = "button"; t.setAttribute("aria-label", "Ver foto " + i);
  t.innerHTML = `<img src="fotos/t/${pad(i)}.jpg" alt="" loading="lazy">`;
  t.onclick = () => go(i - 1); thumbs.appendChild(t);
}
let cur = 0;
function go(i) { cur = (i + N) % N; track.scrollTo({ left: cur * track.clientWidth }); }
function mark() {
  const i = Math.round(track.scrollLeft / track.clientWidth); cur = i;
  $("count").textContent = `${i + 1} / ${N}`;
  [...thumbs.children].forEach((t, k) => t.setAttribute("aria-current", k === i ? "true" : "false"));
  const t = thumbs.children[i]; if (t) thumbs.scrollTo({ left: t.offsetLeft - thumbs.clientWidth / 2 + t.clientWidth / 2, behavior: "smooth" });
}
let raf; track.addEventListener("scroll", () => { cancelAnimationFrame(raf); raf = requestAnimationFrame(mark); });
$("prev").onclick = () => go(cur - 1);
$("next").onclick = () => go(cur + 1);
track.addEventListener("keydown", e => { if (e.key === "ArrowRight") go(cur + 1); if (e.key === "ArrowLeft") go(cur - 1); });
mark();

/* Texto para WhatsApp (se arma solo con los datos) */
let wa = `🏡 *${DATA.tipo.toUpperCase()} EN ${renta ? "RENTA" : "VENTA"} | ${DATA.fraccionamiento.toUpperCase()}*\n\n`;
wa += `💰 *${renta ? "Renta" : "Precio"}: ${mxn(DATA.precio)} MXN${renta ? " / mes" : ""}*\n`;
if (!renta && DATA.avaluo) {
  const pct = Math.round((1 - DATA.precio / DATA.avaluo) * 100);
  wa += `📉 *Avalúo: ${mxn(DATA.avaluo)} MXN*` + (pct > 0 ? ` (aprox. ${pct}% por debajo del avalúo)` : "") + "\n";
}
if (renta && DATA.mantenimiento) wa += "🧾 Mantenimiento: " + rows.find(r => r[0] === "Mantenimiento")[1] + "\n";
if (typeof DATA.construccion === "number") wa += `\n📐 *${DATA.construccion} m² de construcción* en ${DATA.terreno} m² de terreno\n`; else wa += "\n";
wa += `🛏️ ${DATA.recamaras.n} ${DATA.recamaras.l.toLowerCase()} | 🛁 ${DATA.banos.n} ${DATA.banos.l.toLowerCase()} | 🚗 ${DATA.autos.n} ${DATA.autos.l.toLowerCase()}\n`;
DATA.plantas.forEach(p => { wa += `\n🏠 *${p.titulo}*\n` + p.items.map(i => "- " + i).join("\n") + "\n"; });
if (DATA.extras.length) wa += "\n✨ *Extras*\n" + DATA.extras.map(i => "- " + i).join("\n") + "\n";
DATA.ficha.filter(r => /Documentaci|pago/i.test(r[0])).forEach(r => { wa += `\n${/pago/i.test(r[0]) ? "💳" : "📄"} *${r[0]}:* ${r[1]}`; });
wa += `\n📍 Ubicación: ${DATA.fraccionamiento}, ${DATA.ciudad.split(",")[0]}\n\nRef. ${DATA.ref}`;
$("waText").value = wa;
$("copy").onclick = () => {
  const msg = $("copyMsg");
  navigator.clipboard.writeText(wa).then(() => { msg.textContent = "Ficha copiada."; }).catch(() => {
    const ta = $("waText"); ta.hidden = false; ta.style.cssText = "width:100%;height:220px;font:inherit;font-size:.85rem"; ta.select();
    msg.textContent = "Selecciona el texto y cópialo.";
  });
};
</script>
</body>
</html>
